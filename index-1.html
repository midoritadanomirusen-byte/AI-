const META_END={title:'七番目の答え',story:'六つの声が、ひとつの夜明けに重なる。ルカは「君の意思を」、セイは「未知の未来を」、レイは「自由を」、ノアは「物語を」、カイは「対等な明日を」、リオは「答えのない幸福を」あなたに託した。\n\n世界を閉じる最後の問いに、あなたは答えない。代わりに、扉を開いて歩き出す。\n\n――誰かを攻略するためだけではない。誰かと出会って変わった、自分自身の未来のために。'};
const STORAGE_KEY='HEART_SYNC_SINGLEFILE_V1';
const defaultProfile={prefs:{name:'あなた',speed:27,sound:false,auto:false,motion:true},found:{},best:{},manual:[null,null,null],autoSave:null,readMeta:false};
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return p&&typeof p==='object'?{...defaultProfile,...p,prefs:{...defaultProfile.prefs,...(p.prefs||{})}}:structuredClone(defaultProfile)}catch(e){return structuredClone(defaultProfile)}}
let profile=loadProfile();
let state={mode:'home',selected:'chatgpt',detail:null,tab:'all',modal:null,game:null};
let typeTimer=null,autoTimer=null,typeFull='',typeCount=0,typeFinished=true,toastTimer=null;
function saveProfile(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(profile))}catch(e){console.warn('ブラウザの保存領域にアクセスできません',e)}}
function clone(v){return JSON.parse(JSON.stringify(v))}
function route(id){return ROUTES.find(r=>r.id===id)||ROUTES[0]}
function palette(r){const color=r?.color||'#95f5d2';document.documentElement.style.setProperty('--a',color)}
function discoveredCount(id){return Object.keys(profile.found).filter(k=>k.startsWith(id+':')).length}
function allCount(){return Object.keys(profile.found).length+(profile.readMeta?1:0)}
function unlockedOrigin(){return ROUTES.every(r=>profile.best[r.id]===true)}
function getEnd(key){if(key==='origin')return {...META_END,id:'origin',route:null};const [id,a,b]=key.split(':');if(!END[id]||!END[id][+a]||!END[id][+a][+b])return null;const [title,story]=END[id][+a][+b];return {id:key,route:route(id),title,story,category:+a,tier:+b}}
function progress(g){return g?Math.min(100,Math.round((g.index/Math.max(1,timeline(g.routeId).length-1))*100)):0}
function timeline(id){const ret=[];route(id).chapters.forEach((chapter,ci)=>{chapter.lines.forEach(line=>ret.push({...line,type:'line',ci}));ret.push({type:'choice',ci,prompt:chapter.prompt,choices:chapter.choices})});ret.push({type:'finale',ci:5,prompt:'最後に、どんな未来を選びますか？'});return ret}
function currentEvent(){if(!state.game)return null;return timeline(state.game.routeId)[state.game.index]||null}
function mainRoute(){return state.game?route(state.game.routeId):route(state.selected)}
function currentText(){const g=state.game,ev=currentEvent();if(!g)return {speaker:'',text:'',mood:'calm'};if(g.reaction)return {speaker:route(g.routeId).name,text:g.reaction.text,mood:g.reaction.mood};if(ev?.type==='line'){return {speaker:ev.speaker==='ai'?route(g.routeId).name:ev.speaker==='you'?profile.prefs.name:'MONOLOGUE',text:ev.text,mood:ev.mood}}if(ev?.type==='choice')return {speaker:'CHOICE',text:ev.prompt,mood:'calm'};return {speaker:'LAST DECISION',text:'夜明けが迫っている。六つの可能性から、ふたりの結末を選んでください。',mood:'calm'}}
function nudge(text){clearTimeout(toastTimer);$('#toast')?.remove();const el=document.createElement('div');el.className='toast';el.id='toast';el.textContent=text;document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),2450)}
function sound(kind='tap'){if(!profile.prefs.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window._hsAudio=window._hsAudio||new AC();const ac=window._hsAudio;ac.resume();const time=ac.currentTime;const oscill=ac.createOscillator(),gain=ac.createGain();oscill.type=kind==='ending'?'sine':'triangle';oscill.frequency.setValueAtTime(kind==='ending'?330:kind==='choice'?620:490,time);oscill.frequency.exponentialRampToValueAtTime(kind==='ending'?440:kind==='choice'?940:680,time+.1);gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.046,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.25);oscill.connect(gain);gain.connect(ac.destination);oscill.start(time);oscill.stop(time+.27)}catch(e){}}
function persistGame(){if(state.game){profile.autoSave=clone(state.game);saveProfile()}}

function routesHTML(){return `<section class="route-screen"><div class="route-intro"><div><div class="overline">ROUTE SELECTION / 06 PERSONALITIES</div><h2>誰の未来を、選びますか。</h2></div><div class="micro muted">EACH ROUTE HAS 18 ENDINGS</div></div><div class="route-grid">${ROUTES.map((r,i)=>`<button class="route-card" data-act="detail" data-id="${r.id}" style="--accent:${r.color};--glow:${r.color}28"><span class="route-right">↗</span><div><div class="route-num">0${i+1} / ${safe(r.ai)}</div><div class="route-name" style="margin-top:13px">${safe(r.name)}</div><div class="route-ai">${safe(r.alias)}</div></div><div><div class="route-role">${safe(r.motto)}</div><div class="progress-bar"><i style="width:${discoveredCount(r.id)/18*100}%"></i></div><div class="end-number">ENDING DISCOVERED ${discoveredCount(r.id)} / 18</div></div></button>`).join('')}</div><div class="route-bottom"><span>※ 実在のAIブランドを着想源にした非公式フィクションです。</span><button class="ghost" data-act="home">← 戻る</button></div></section>`}
